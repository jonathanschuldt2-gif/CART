services:
  - type: web
    name: reseller-os
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reseller-os-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: reseller-os-db
    databaseName: reseller_os
    plan: plan: basic-256mb
